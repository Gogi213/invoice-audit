<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>AI Estimate — our dictation sheet</title>
<style>
  :root{--lime:#C7F36B;--lime50:#F4FAE8;--ink:#101211;--muted:#646A65;--violet:#6B5BD2;--teal:#1F8A80;--line:#E6E8E3;--danger:#C0392B}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);background:#8E918C;max-width:500px;margin:0 auto;position:relative;overflow:hidden}
  .under{position:absolute;inset:0;background:#F8F8F4;filter:brightness(.55)}
  .under h1{font-size:34px;font-weight:600;padding:70px 17px 0}
  .sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 44px);background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding:0 17px calc(env(safe-area-inset-bottom) + 12px)}
  .grab{width:36px;height:5px;border-radius:3px;background:#D9DDD7;margin:8px auto 14px}
  .hd{display:flex;gap:12px;align-items:center}
  .mic{width:44px;height:44px;border-radius:22px;background:var(--lime);display:grid;place-items:center;flex:none}
  .mic svg{width:20px;height:20px}
  .hd .t{font-size:16px;font-weight:700}
  .hd .s{font-size:13px;color:var(--muted)}
  .say{font-size:14px;line-height:20px;color:var(--muted);margin:14px 0 10px;min-height:40px}
  .say b{color:var(--ink);font-weight:500}
  .scroll{flex:1;overflow-y:auto;margin:0 -17px;padding:2px 17px 12px}
  .card{background:#fff;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0 14px}
  .f{padding:12px 0;border-bottom:1px solid var(--line)}
  .f:last-child{border-bottom:0}
  .f .l{font-size:13px;color:var(--muted);margin-bottom:3px}
  .f .v{font-size:16px;font-weight:600;min-height:20px}
  .f .v.q{color:var(--danger)}
  .two{display:flex}.two>div{flex:1}
  .svc{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 0}
  .svc+.svc{border-top:1px dashed var(--line)}
  .svc .n{font-size:16px;font-weight:600}
  .svc .d{font-size:13px;color:var(--muted)}
  .svc .p{font-size:16px;font-weight:600;white-space:nowrap;margin-left:8px}
  .svc .p.wait{color:#C5C9C3}
  .svc.ai .p{border-bottom:1px dashed var(--violet);cursor:pointer}
  .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:3px}
  .tag.hist{background:var(--lime50);color:#3C5C14;border:1px solid #C7E59A}
  .tag.data{background:#E6F4F2;color:var(--teal);border:1px solid #B9E0DB}
  .tag.ai{background:#EFEDFB;color:var(--violet);border:1px solid #D6D1F5}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:15px 14px;font:inherit;font-size:16px;font-weight:600;margin-top:8px;color:var(--ink)}
  .opt small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .qtitle{font-size:13px;color:var(--muted);margin:14px 0 0 2px}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:70px;margin:18px 0 8px}
  .wave i{width:3px;border-radius:2px;background:var(--ink);height:4px;transition:height .12s}
  .tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:12px 0}
  .btns{display:flex;flex-direction:column;gap:8px;padding-top:8px}
  .btn{height:50px;border-radius:25px;border:0;font:inherit;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.main{background:var(--ink);color:#fff}
  .row2{display:flex;gap:8px}.row2 .btn{flex:1;background:#fff;border:1px solid #D9DDD7;color:var(--ink);font-weight:500}
  .row2 .btn.dis{background:#F0F1EE;color:#9A9F99;border-color:#F0F1EE}
  .in{animation:in .4s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .shimmer{background:linear-gradient(90deg,#F0F1EE 0,#E3E6E0 40%,#F0F1EE 80%);background-size:200% 100%;animation:sh 1.1s infinite linear;border-radius:6px;color:transparent!important;min-width:56px}
  @keyframes sh{to{background-position:-200% 0}}
  .note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="under"><h1>Estimates</h1></div>
<div class="sheet">
  <div class="grab"></div>
  <div class="hd"><div class="mic" id="mic"></div><div><div class="t">AI estimate</div><div class="s" id="sub">Listening…</div></div></div>
  <div class="say" id="say">Say the client and the job — what, how big. Prices come from your invoices, then market data, then an AI guess.</div>
  <div class="scroll" id="scroll">
    <div class="card">
      <div class="f"><div class="l">Client</div><div class="v" id="client">—</div></div>
      <div class="f"><div class="l">Services</div><div id="svcs"><div class="v">—</div></div></div>
      <div class="f two"><div><div class="l">Discount</div><div class="v">—</div></div><div><div class="l">Tax</div><div class="v" id="tax">—</div></div></div>
      <div class="f" id="totrow" style="display:none"><div class="tot" style="padding:0"><span>Total</span><span id="tot">$0</span></div></div>
    </div>
    <div id="extra"></div>
  </div>
  <div class="wave" id="wave"></div>
  <div class="btns" id="btns"></div>
</div>

<script>
(function () {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const money = v => "$" + Math.round(v).toLocaleString("en-US");
  const $ = id => document.getElementById(id);
  const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="#101211" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
  const WAVEI = `<svg viewBox="0 0 24 24" stroke="#101211" stroke-width="2.4" stroke-linecap="round"><path d="M6 10v4M9 7v10M12 9v6M15 6v12M18 10v4"/></svg>`;
  const TAG = {hist: "Your price", data: "Market", ai: "AI guess · tap to check"};
  let phase = "listen", sq = null, total = 0, lines = [];

  // waveform
  const W = $("wave"); W.innerHTML = Array.from({length: 46}, () => "<i></i>").join("");
  const bars = [...W.children];
  let waveOn = true;
  (async function wave() { while (true) { bars.forEach((b, i) => b.style.height = waveOn ? (4 + Math.abs(Math.sin(Date.now() / 180 + i * .6)) * (8 + Math.random() * 30)) + "px" : "4px"); await sleep(110); } })();

  function buttons(kind) {
    const B = $("btns");
    if (kind === "listen") B.innerHTML = `<button class="btn main" id="stop"><span style="width:12px;height:12px;background:#fff;border-radius:2px"></span>Stop</button><div class="row2"><button class="btn" onclick="location.reload()">Cancel</button><button class="btn dis">Record again</button></div>`;
    if (kind === "busy") B.innerHTML = `<button class="btn main" style="opacity:.4">Building estimate…</button><div class="row2"><button class="btn" onclick="location.reload()">Cancel</button><button class="btn dis">Record again</button></div>`;
    if (kind === "done") B.innerHTML = `<button class="btn main" id="add">＋ Add to estimate</button><div class="row2"><button class="btn" onclick="location.reload()">Cancel</button><button class="btn" onclick="location.reload()">Record again</button></div>`;
    const s = $("stop"); if (s) s.onclick = stop;
    const a = $("add"); if (a) a.onclick = () => { a.textContent = "Added ✓ — opens the estimate form"; };
  }

  // 1. Listening: live transcript fills the client
  const PHRASE = "Bathroom remodel for Anna Lee — replace the tiles, new vanity, paint the ceiling, eight percent tax.";
  let heard = "";
  async function listen() {
    $("mic").innerHTML = WAVEI; buttons("listen");
    await sleep(900);
    const words = PHRASE.split(" ");
    for (const w of words) {
      if (phase !== "listen") return;
      heard += (heard ? " " : "") + w;
      $("say").innerHTML = `“<b>${heard}</b>”`;
      if (heard.includes("Anna Lee") && $("client").textContent === "—") { $("client").textContent = "Anna Lee"; $("client").classList.add("pop"); }
      if (heard.includes("percent") && $("tax").textContent === "—") { $("tax").textContent = "8%"; $("tax").classList.add("pop"); }
      await sleep(230);
    }
    $("sub").textContent = "Listening… tap Stop when done";
  }

  // 2. Stop → services appear, prices look up
  async function stop() {
    if (phase !== "listen") return; phase = "busy";
    if (!heard.includes("ceiling")) { heard = PHRASE; $("say").innerHTML = `“<b>${heard}</b>”`; $("client").textContent = "Anna Lee"; $("tax").textContent = "8%"; }
    waveOn = false; W.style.display = "none"; $("mic").innerHTML = MIC; $("sub").textContent = "Building the estimate…"; buttons("busy");
    lines = [
      {n: "Tile removal", per: 3.5, unit: "sq ft", src: "hist", note: "INV-0014", area: true},
      {n: "Tile installation", per: 12, unit: "sq ft", src: "hist", note: "INV-0014", area: true},
      {n: "Porcelain tiles", per: 6.2, unit: "sq ft", src: "data", note: "avg in your area", area: true, waste: 1.1},
      {n: "Vanity installation", per: 450, unit: "", src: "data", note: "range $300–600"},
      {n: "Ceiling paint", per: 280, unit: "room", src: "hist", note: "INV-0009"},
      {n: "Debris disposal", per: 150, unit: "load", src: "ai", note: ""},
    ];
    const S = $("svcs"); S.innerHTML = "";
    for (const l of lines) {
      S.insertAdjacentHTML("beforeend", `<div class="svc in"><div><div class="n">${l.n}</div><div class="d" data-d>${l.area ? "? sq ft" : "1 " + (l.unit || "×")}</div><span class="tag ${l.src}" style="opacity:0" data-t>${TAG[l.src]}${l.note ? " · " + l.note : ""}</span></div><div class="p wait shimmer" data-p>$000</div></div>`);
      await sleep(260);
    }
    await sleep(400);
    ask();
  }

  // 3. One question for what was not said
  function ask() {
    $("sub").textContent = "One thing is missing";
    $("client").parentNode.parentNode.querySelectorAll(".svc").forEach(r => r.querySelector("[data-d]").classList.add("q"));
    $("extra").innerHTML = `<div class="qtitle in">How big is the floor to tile?</div>` +
      ["40 sq ft", "60 sq ft", "80 sq ft"].map(v => `<button class="opt in" data-v="${parseInt(v)}">${v}</button>`).join("") +
      `<button class="opt in" data-v="0" style="color:var(--muted);font-weight:500">Not sure <small>use a typical 50 sq ft</small></button>`;
    $("scroll").scrollTo({top: 9999, behavior: "smooth"});
    $("extra").querySelectorAll(".opt").forEach(b => b.onclick = () => { sq = +b.dataset.v || 50; $("extra").innerHTML = ""; price(); });
  }

  // 4. Prices resolve, each with its source
  async function price() {
    $("sub").textContent = "Finding prices…";
    const rows = [...$("svcs").children];
    total = 0;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i], r = rows[i];
      l.q = l.area ? Math.round(sq * (l.waste || 1)) : 1;
      l.v = l.q * l.per;
      r.querySelector("[data-d]").textContent = l.area ? `${l.q} sq ft × $${l.per}` : `1 ${l.unit || "×"}${l.unit ? "" : " $" + l.per}`.replace("1 ×", "1 ×");
      await sleep(330);
      const p = r.querySelector("[data-p]"); p.classList.remove("wait", "shimmer"); p.classList.add("pop"); p.textContent = money(l.v);
      const t = r.querySelector("[data-t]"); t.style.opacity = 1; t.classList.add("pop");
      if (l.src === "ai") { r.classList.add("ai"); p.onclick = () => check(i, r); }
      total += l.v; $("totrow").style.display = ""; $("tot").textContent = money(total * 1.08) + " incl. tax";
    }
    $("sub").textContent = "Done — check and add";
    $("extra").innerHTML = `<div class="note in">3 prices from your invoices · 2 market · 1 AI guess — tap it to check</div>`;
    buttons("done");
  }

  // 5. Check the AI guess — same pattern as the client question
  function check(i, r) {
    const l = lines[i];
    $("extra").innerHTML = `<div class="qtitle in">${l.n}: no price in your invoices or market data. What do you charge?</div>` +
      [100, 150, 200, 250].map(v => `<button class="opt in" data-v="${v}">$${v}${v === 150 ? "<small>AI guess</small>" : ""}</button>`).join("");
    $("scroll").scrollTo({top: 9999, behavior: "smooth"});
    $("extra").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const v = +b.dataset.v; total += v - l.v; l.v = v; l.per = v; l.src = "hist";
      r.classList.remove("ai"); r.querySelector("[data-p]").textContent = money(v); r.querySelector("[data-p]").onclick = null;
      const t = r.querySelector("[data-t]"); t.className = "tag hist pop"; t.textContent = "Your price · saved for next time";
      $("tot").textContent = money(total * 1.08) + " incl. tax";
      $("extra").innerHTML = `<div class="note in">All prices are yours or market — ready to add</div>`;
    });
  }

  $("mic").innerHTML = WAVEI;
  listen();
})();
</script>
</body>
</html>
